<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Unfill concepts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" />
  </head>
  <body>
    <canvas id="stage" aria-label="The puzzle board. Tap a piece to lift its group."></canvas>
    <header class="hud" id="hud">
      <div class="chip" id="level"></div>
      <div class="chip" id="moves" aria-live="polite"></div>
    </header>
    <div class="toast" id="toast" role="status"></div>
    <footer class="foot" id="foot">
      <button class="round" id="undo" type="button" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 7H4V2M4.6 7A8.5 8.5 0 1 1 3.5 13" /></svg></button>
      <div class="picker">
        <button id="prev" type="button" aria-label="Previous concept">‹</button>
        <div><b id="cname"></b><small id="cblurb"></small></div>
        <button id="next" type="button" aria-label="Next concept">›</button>
      </div>
      <button class="round" id="restart" type="button" aria-label="Restart level"><svg viewBox="0 0 24 24"><path d="M20 4v5h-5M19.4 9A8.5 8.5 0 1 0 20.5 13" /></svg></button>
    </footer>
    <script type="module" src="/src/app/concepts/main.ts"></script>
  </body>
</html>
